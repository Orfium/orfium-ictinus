name: CI/CD
on:
  push:
    branches: ['master', 'next']
  pull_request:

permissions:
  deployments: write
  packages: write
  contents: read
  id-token: write

jobs:
  precommit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 #v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 #v7.1.0
        with:
          node-version-file: 'package.json'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Run precommit checks
        run: pnpm check

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 #v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 #v7.1.0
        with:
          node-version-file: 'package.json'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Run tests
        run: pnpm test

  select-deployment-target:
    runs-on: ubuntu-latest
    outputs:
      target: ${{ steps.get-target.outputs.target }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1
        with:
          fetch-depth: 0

      - id: get-target
        run: |
          TARGET=review
          if [[ ${{ github.event_name }} == "push" ]]; then
            # TODO: The conditions here depend on the different deployment targets you have
            if [[ ${{ github.ref }} == "refs/heads/master" ]]; then
              TARGET=prod
            elif [[ ${{ github.ref }} == "refs/heads/next" ]]; then
              TARGET=next
            fi
          else
            if [ ! -f .github/workflows/teardown.yml ]; then
              echo "Set up the teardown flow and try again!"
              exit 1
            fi
          fi
          echo "target=$TARGET" >> $GITHUB_OUTPUT

  deploy-app:
    needs:
      - select-deployment-target
      - precommit
      - test
    uses: ./.github/workflows/deploy-frontend.yml
    concurrency: ${{ github.ref }}
    with:
      target-environment: ${{ needs.select-deployment-target.outputs.target }}
